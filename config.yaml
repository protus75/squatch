# squatch instance config for this checkout (SQUATCH_PLAN.md section 15).
# HOST-PLANE: operator-owned truth. The engine reads it and never rewrites it;
# a provider or model change is an edit here, between runs, never a ticket edit.
#
# Model aliases/ids were resolved from the installed CLIs. Claude uses the
# validated haiku alias at low, sonnet at medium, and opus at high/max. Codex
# follows the visible four-step capability ladder reported by its model catalog.

schema_version: 1
state_dir: .squatch/state

providers:
  # `name` selects the engine's cli adapter (claude | codex). Both CLIs on this
  # machine run on ambient login, so neither declares `auth` (an env-var NAME
  # is declared only when a key must be injected into the call).
  - name: claude
    kind: cli
    models_by_tier:
      low: haiku
      medium: sonnet
      high: opus
      max: opus
    # The claude stream reports usage and cost per call: no flat estimate.
    limits: {concurrency: 1}
  - name: codex
    kind: cli
    models_by_tier:
      low: gpt-5.6-luna
      medium: gpt-5.6-terra
      high: gpt-5.6-sol
      max: gpt-6-astra
    # The codex stream reports usage but no cost: the recommended flat
    # estimate for a flat-subscription agent CLI charges per call (section 0).
    limits: {concurrency: 1, est_cost_per_call_usd: 1.00}

# (agent_tier, llm_surface) -> ordered candidates; the first serves (Phase 1).
# A surface with no row of its own inherits the `review` row.
routing:
  # REVIEW: Claude stays separate from the Codex implementer. High uses Sonnet
  # so the fixed-$5 GO grade can score all 50 defects; max retains Opus.
  - {tier: low,    surface: review, candidates: [{provider: claude, model: opus}]}
  - {tier: medium, surface: review, candidates: [{provider: claude, model: opus}]}
  - {tier: high,   surface: review, candidates: [{provider: claude, model: sonnet}]}
  - {tier: max,    surface: review, candidates: [{provider: claude, model: opus}]}
  # AUTHOR: claude, inheriting models_by_tier[tier].
  - {tier: low,    surface: author, candidates: [{provider: claude}]}
  - {tier: medium, surface: author, candidates: [{provider: claude}]}
  - {tier: high,   surface: author, candidates: [{provider: claude}]}
  - {tier: max,    surface: author, candidates: [{provider: claude}]}
  # IMPLEMENT: codex (kind: cli -- the one surface granted write), inheriting
  # models_by_tier[tier].
  - {tier: low,    surface: implement, candidates: [{provider: codex}]}
  - {tier: medium, surface: implement, candidates: [{provider: codex}]}
  - {tier: high,   surface: implement, candidates: [{provider: codex}]}
  - {tier: max,    surface: implement, candidates: [{provider: codex}]}

routing_default_tier: medium

# section 18 -- the self-build drain's unattended safety envelope. Raised from
# the shipped 90 so the Phase 2 spine seeds (stuck budgets up to 180m, their
# real hang bound) dispatch instead of parking; upward only, the one sanctioned
# edit of this file (section 0 prompt 14).
drain:
  max_ticket_minutes: 180
