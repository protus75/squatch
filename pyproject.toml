[project]
name = "squatch"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at ./squatch, not ./src/squatch.
module-root = ""
